<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>2048</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d1a;
      --card: #1a1c35;
      --card2: #202240;
      --accent: #7c6aff;
      --accent2: #ff6a9e;
      --accent3: #00d4ff;
      --gold: #ffd700;
      --text: #e8eaf6;
      --muted: #5a5e82;
      --gap: 10px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    body {
      font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      /* respect notch/home bar */
      padding-top: max(12px, var(--safe-top));
      padding-bottom: max(0px, var(--safe-bottom));
      padding-left: max(14px, var(--safe-left));
      padding-right: max(14px, var(--safe-right));
    }

    /* ambient glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 40% at 15% 10%, rgba(124,106,255,.14) 0%, transparent 55%),
        radial-gradient(ellipse 50% 55% at 85% 85%, rgba(0,212,255,.09) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      margin-bottom: 10px;
      position: relative;
      z-index: 2;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
      line-height: 1;
    }

    .scores {
      display: flex;
      gap: 8px;
    }

    .score-box {
      background: var(--card);
      border-radius: 12px;
      padding: 6px 14px;
      text-align: center;
      min-width: 70px;
      border: 1px solid rgba(255,255,255,.06);
    }

    .score-box .lbl {
      font-size: .58rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .score-box .val {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .val.bump { animation: bump .25s ease; }
    @keyframes bump {
      0%   { transform: scale(1); color: var(--text); }
      50%  { transform: scale(1.3); color: var(--gold); }
      100% { transform: scale(1); color: var(--text); }
    }

    /* ── LEVEL STRIP ── */
    .level-strip {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-bottom: 8px;
      position: relative;
      z-index: 2;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .level-strip::-webkit-scrollbar { display: none; }

    .lvl-btn {
      flex-shrink: 0;
      padding: 7px 12px;
      border: 1.5px solid rgba(255,255,255,.08);
      border-radius: 10px;
      background: var(--card);
      color: var(--muted);
      font-size: .72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s ease;
      text-align: center;
      line-height: 1.3;
      -webkit-tap-highlight-color: transparent;
    }

    .lvl-btn .ln { display: block; font-size: .82rem; color: var(--text); font-weight: 800; }

    .lvl-btn.active {
      border-color: var(--accent);
      background: rgba(124,106,255,.2);
    }

    .lvl-btn.locked { opacity: .3; }

    .lvl-btn:active:not(.locked) { transform: scale(.94); }

    /* ── STAT ROW ── */
    .stat-row {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-bottom: 8px;
      position: relative;
      z-index: 2;
    }

    .chip {
      flex: 1;
      background: var(--card);
      border-radius: 10px;
      padding: 6px 4px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.05);
    }

    .chip .cl { font-size: .56rem; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; font-weight: 700; }
    .chip .cv { font-size: .95rem; font-weight: 800; color: var(--accent3); }

    /* ── PROGRESS BARS ── */
    .bars {
      flex-shrink: 0;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      position: relative;
      z-index: 2;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bar-label {
      font-size: .62rem;
      font-weight: 700;
      color: var(--muted);
      width: 54px;
      flex-shrink: 0;
    }

    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,.07);
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .4s ease;
    }

    .bar-fill.acc { background: linear-gradient(90deg, var(--accent2), var(--accent)); }
    .bar-fill.lvl { background: linear-gradient(90deg, var(--accent), var(--accent3)); }

    .bar-pct {
      font-size: .62rem;
      font-weight: 700;
      color: var(--text);
      width: 30px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── BOARD ── */
    .board-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      min-height: 0;
      margin-bottom: 8px;
    }

    .board-bg {
      background: var(--card);
      border-radius: 16px;
      padding: var(--gap);
      border: 1px solid rgba(255,255,255,.07);
      box-shadow: 0 16px 48px rgba(0,0,0,.5), 0 0 0 1px rgba(124,106,255,.12);
      position: relative;
      touch-action: none;
    }

    .grid {
      display: grid;
      gap: var(--gap);
    }

    .cell {
      border-radius: 8px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.04);
    }

    .tile-container {
      position: absolute;
      inset: var(--gap);
      pointer-events: none;
    }

    .tile {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: 900;
      transition: left .1s ease, top .1s ease;
      will-change: left, top;
    }

    .tile.spawn  { animation: pop .18s ease forwards; }
    .tile.merged { animation: pop .2s ease forwards, glow .35s ease forwards; z-index: 5; }

    @keyframes pop {
      0%  { transform: scale(.25); opacity: 0; }
      60% { transform: scale(1.1); }
      100%{ transform: scale(1); opacity: 1; }
    }
    @keyframes glow {
      0%  { box-shadow: 0 0 0 0 rgba(255,215,0,.8); }
      50% { box-shadow: 0 0 18px 6px rgba(255,215,0,.4); }
      100%{ box-shadow: 0 0 0 0 rgba(255,215,0,0); }
    }

    /* tile palette */
    .t2    { background:#263360; color:#9fa8da; }
    .t4    { background:#312660; color:#ce93d8; }
    .t8    { background:#6200ea; color:#fff; }
    .t16   { background:#4527a0; color:#fff; }
    .t32   { background:#c62828; color:#fff; }
    .t64   { background:#ad1457; color:#fff; }
    .t128  { background:#e65100; color:#fff; }
    .t256  { background:#f57f17; color:#fff; }
    .t512  { background:#f9a825; color:#111; }
    .t1024 { background:#558b2f; color:#fff; }
    .t2048 { background:linear-gradient(135deg,#f9a825,#e65100); color:#fff; box-shadow:0 0 24px rgba(249,168,37,.5); }
    .t4096 { background:linear-gradient(135deg,#00b0ff,#1565c0); color:#fff; box-shadow:0 0 24px rgba(0,176,255,.5); }
    .t8192 { background:linear-gradient(135deg,#e040fb,#4a148c); color:#fff; box-shadow:0 0 24px rgba(224,64,251,.5); }
    .tbig  { background:linear-gradient(135deg,#69f0ae,#00b0ff); color:#0a1a0a; }

    /* ── OVERLAY ── */
    .overlay {
      display: none;
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: rgba(10,10,24,.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 20;
      padding: 20px;
    }
    .overlay.show { display: flex; }

    .ov-title { font-size: 1.9rem; font-weight: 900; }
    .ov-sub   { font-size: .82rem; color: var(--muted); text-align: center; line-height: 1.5; }

    .ov-btns { display: flex; gap: 8px; margin-top: 4px; width: 100%; }
    .ov-btns .btn { flex: 1; }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      padding-bottom: max(8px, var(--safe-bottom));
      position: relative;
      z-index: 2;
    }

    .btn {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 14px;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .1s ease;
      letter-spacing: .3px;
    }
    .btn:active { transform: scale(.93); }

    .btn-primary  { background: linear-gradient(135deg, var(--accent), var(--accent3)); color: #fff; }
    .btn-undo     { background: var(--card2); color: var(--text); border: 1px solid rgba(255,255,255,.1); }
    .btn-reset    { background: linear-gradient(135deg, #c62828, #880e4f); color: #fff; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: calc(80px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(26,28,53,.96);
      border: 1px solid rgba(124,106,255,.35);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 99px;
      font-size: .82rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── COMBO ── */
    #combo-pop {
      position: fixed;
      top: 42%;
      left: 50%;
      transform: translate(-50%,-50%) scale(0);
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 0 24px rgba(255,215,0,.8);
      pointer-events: none;
      z-index: 300;
    }
    #combo-pop.fire { animation: cfire .65s ease forwards; }
    @keyframes cfire {
      0%  { transform: translate(-50%,-50%) scale(0); opacity:1; }
      40% { transform: translate(-50%,-62%) scale(1.5); opacity:1; }
      100%{ transform: translate(-50%,-80%) scale(1); opacity:0; }
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <div class="logo">2048</div>
  <div class="scores">
    <div class="score-box">
      <div class="lbl">Score</div>
      <div class="val" id="score">0</div>
    </div>
    <div class="score-box">
      <div class="lbl">Best</div>
      <div class="val" id="best">0</div>
    </div>
  </div>
</div>

<!-- Level strip -->
<div class="level-strip" id="levelStrip"></div>

<!-- Stats -->
<div class="stat-row">
  <div class="chip"><div class="cl">Moves</div><div class="cv" id="st-moves">0</div></div>
  <div class="chip"><div class="cl">Merges</div><div class="cv" id="st-merges">0</div></div>
  <div class="chip"><div class="cl">Combo</div><div class="cv" id="st-combo">×1</div></div>
  <div class="chip"><div class="cl">Time</div><div class="cv" id="st-timer">0:00</div></div>
</div>

<!-- Progress bars -->
<div class="bars">
  <div class="bar-row">
    <div class="bar-label" id="bar-acc-lbl">Accuracy</div>
    <div class="bar-track"><div class="bar-fill acc" id="acc-fill" style="width:0%"></div></div>
    <div class="bar-pct" id="acc-pct">—</div>
  </div>
  <div class="bar-row">
    <div class="bar-label" id="bar-lvl-lbl">Progress</div>
    <div class="bar-track"><div class="bar-fill lvl" id="lvl-fill" style="width:0%"></div></div>
    <div class="bar-pct" id="lvl-pct">0%</div>
  </div>
</div>

<!-- Board -->
<div class="board-wrap">
  <div class="board-bg" id="boardBg">
    <div class="grid" id="grid"></div>
    <div class="tile-container" id="tiles"></div>

    <div class="overlay" id="ov-win">
      <div class="ov-title" style="background:linear-gradient(135deg,#f9a825,#e65100);-webkit-background-clip:text;-webkit-text-fill-color:transparent">You Win!</div>
      <div class="ov-sub" id="win-sub"></div>
      <div class="ov-btns">
        <button class="btn btn-primary" ontouchend="ev(event,continueGame)">Keep Going</button>
        <button class="btn btn-undo"    ontouchend="ev(event,nextLevel)">Next Level</button>
      </div>
    </div>

    <div class="overlay" id="ov-lose">
      <div class="ov-title" style="color:var(--accent2)">Game Over</div>
      <div class="ov-sub" id="lose-sub"></div>
      <div class="ov-btns">
        <button class="btn btn-primary" ontouchend="ev(event,newGame)">Try Again</button>
        <button class="btn btn-undo"    ontouchend="ev(event,prevLevel)">Easier</button>
      </div>
    </div>
  </div>
</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <button class="btn btn-primary" ontouchend="ev(event,newGame)">New Game</button>
  <button class="btn btn-undo"    ontouchend="ev(event,undoMove)">Undo</button>
  <button class="btn btn-reset"   ontouchend="ev(event,resetAll)">Reset</button>
</div>

<div id="toast"></div>
<div id="combo-pop"></div>

<script>
/* prevent double-fire on touch+click devices */
function ev(e, fn) { e.preventDefault(); fn(); }

/* ── LEVELS ── */
const LEVELS = [
  { id:0, name:'Easy',    sub:'4×4·512',  size:4, target:512,  spawnRate4:.10, mult:1,   color:'#7c6aff', unlock:0     },
  { id:1, name:'Classic', sub:'4×4·2048', size:4, target:2048, spawnRate4:.10, mult:1.5, color:'#00d4ff', unlock:0     },
  { id:2, name:'Hard',    sub:'5×5·2048', size:5, target:2048, spawnRate4:.15, mult:2,   color:'#ff6a9e', unlock:500   },
  { id:3, name:'Expert',  sub:'6×6·4096', size:6, target:4096, spawnRate4:.20, mult:3,   color:'#ffd700', unlock:2000  },
  { id:4, name:'Master',  sub:'8×8·8192', size:8, target:8192, spawnRate4:.25, mult:5,   color:'#69f0ae', unlock:10000 },
];

/* ── STATE ── */
const S = {
  lvl:0, size:4, board:[], score:0, best:0,
  bestByLvl:{}, bestAccByLvl:{},
  moves:0, merges:0, prodMoves:0, streak:0,
  won:false, keepGoing:false, over:false,
  unlocked: new Set([0,1]),
  history:[], t0: Date.now(), elapsed:0,
};

let cellPx = 0;

/* ── PERSIST ── */
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('2048x') || '{}');
    S.best        = d.best || 0;
    S.bestByLvl   = d.bestByLvl || {};
    S.bestAccByLvl= d.bestAccByLvl || {};
    S.unlocked    = new Set(d.unlocked || [0,1]);
    S.lvl         = d.lvl || 0;
  } catch(e){}
}
function save() {
  try {
    localStorage.setItem('2048x', JSON.stringify({
      best: S.best, bestByLvl: S.bestByLvl,
      bestAccByLvl: S.bestAccByLvl,
      unlocked: [...S.unlocked], lvl: S.lvl,
    }));
  } catch(e){}
}

/* ── BOOT ── */
window.addEventListener('DOMContentLoaded', () => {
  load();
  buildLevelStrip();
  newGame();
  bindSwipe();
  setInterval(tickTimer, 500);
});

/* ── LEVEL STRIP ── */
function buildLevelStrip() {
  const el = document.getElementById('levelStrip');
  el.innerHTML = '';
  LEVELS.forEach(lv => {
    const b = document.createElement('button');
    b.className = 'lvl-btn' +
      (lv.id === S.lvl ? ' active' : '') +
      (!S.unlocked.has(lv.id) ? ' locked' : '');
    b.innerHTML = `<span class="ln">${lv.name}</span><span style="color:${lv.color};font-size:.65rem">${lv.sub}</span>`;
    b.ontouchend = e => {
      e.preventDefault();
      if (!S.unlocked.has(lv.id)) { toast(`Score ${lv.unlock.toLocaleString()} to unlock`); return; }
      S.lvl = lv.id;
      buildLevelStrip();
      newGame();
    };
    el.appendChild(b);
  });
  /* scroll active button into view */
  const active = el.querySelector('.active');
  if (active) active.scrollIntoView({ inline:'center', behavior:'smooth' });
}

/* ── NEW GAME ── */
function newGame() {
  const lv = LEVELS[S.lvl];
  S.size = lv.size;
  S.board = Array.from({length:S.size}, () => Array(S.size).fill(0));
  S.score = 0; S.moves = 0; S.merges = 0;
  S.prodMoves = 0; S.streak = 0;
  S.won = false; S.keepGoing = false; S.over = false;
  S.history = []; S.elapsed = 0; S.t0 = Date.now();
  spawn(); spawn();
  buildGrid();
  hideOverlays();
  render();
  refresh();
}

function nextLevel() {
  const n = S.lvl + 1;
  if (n < LEVELS.length && S.unlocked.has(n)) { S.lvl = n; buildLevelStrip(); newGame(); }
  else { toast('No next level yet!'); hideOverlays(); }
}
function prevLevel() {
  S.lvl = Math.max(0, S.lvl - 1);
  buildLevelStrip(); newGame();
}
function continueGame() {
  S.keepGoing = true;
  document.getElementById('ov-win').classList.remove('show');
}
function resetAll() {
  localStorage.removeItem('2048x');
  S.best = 0; S.bestByLvl = {}; S.bestAccByLvl = {};
  S.unlocked = new Set([0,1]); S.lvl = 0;
  buildLevelStrip(); newGame(); toast('All data reset');
}

/* ── BOARD ── */
function spawn() {
  const empties = [];
  for (let r = 0; r < S.size; r++)
    for (let c = 0; c < S.size; c++)
      if (!S.board[r][c]) empties.push([r,c]);
  if (!empties.length) return null;
  const [r,c] = empties[Math.floor(Math.random()*empties.length)];
  S.board[r][c] = Math.random() < LEVELS[S.lvl].spawnRate4 ? 4 : 2;
  return [r,c];
}

/* ── BUILD GRID DOM ── */
function buildGrid() {
  const N = S.size;
  const gap = 10;
  /* fill available space */
  const bw = document.querySelector('.board-wrap');
  const avail = Math.min(bw.clientWidth - 28, bw.clientHeight - 28, 480);
  cellPx = Math.floor((avail - gap * (N + 1)) / N);

  const grid = document.getElementById('grid');
  grid.style.gridTemplateColumns = `repeat(${N},${cellPx}px)`;
  grid.innerHTML = '';
  for (let i = 0; i < N*N; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.style.cssText = `width:${cellPx}px;height:${cellPx}px`;
    grid.appendChild(c);
  }
  document.getElementById('tiles').innerHTML = '';
}

/* ── RENDER ── */
function render() {
  const cont = document.getElementById('tiles');
  cont.innerHTML = '';
  for (let r = 0; r < S.size; r++)
    for (let c = 0; c < S.size; c++)
      if (S.board[r][c]) cont.appendChild(makeTile(S.board[r][c], r, c));
}

function makeTile(val, r, c, spawn=false, merged=false) {
  const gap = 10;
  const t = document.createElement('div');
  t.className = `tile ${tileClass(val)}${spawn?' spawn':''}${merged?' merged':''}`;
  t.style.cssText = `
    width:${cellPx}px; height:${cellPx}px;
    left:${c*(cellPx+gap)}px; top:${r*(cellPx+gap)}px;
    font-size:${fontSize(val)}px;
  `;
  t.textContent = val;
  return t;
}

function tileClass(v) { return v <= 8192 ? 't'+v : 'tbig'; }

function fontSize(v) {
  const len = String(v).length;
  const b = cellPx * 0.42;
  if (len <= 2) return Math.round(b);
  if (len === 3) return Math.round(b * .72);
  if (len === 4) return Math.round(b * .58);
  return Math.round(b * .46);
}

/* ── MOVE ENGINE ── */
function move(dir) {
  if (S.over) return;
  const prev = JSON.stringify(S.board);
  pushHistory();

  let gained = 0, mergesNow = 0;
  for (let i = 0; i < S.size; i++) {
    const line = getLine(i, dir);
    const [nl, g, m] = mergeLine(line);
    setLine(i, dir, nl);
    gained += g; mergesNow += m;
  }

  if (JSON.stringify(S.board) === prev) {
    S.streak = 0; render(); refresh(); return;
  }

  S.score += Math.round(gained * LEVELS[S.lvl].mult);
  S.moves++;
  S.merges += mergesNow;

  if (mergesNow > 0) {
    S.prodMoves++;
    S.streak++;
    if (S.streak >= 3) showCombo(S.streak);
  } else {
    S.streak = 0;
  }

  const newTile = spawn();

  /* animated re-render */
  const cont = document.getElementById('tiles');
  cont.innerHTML = '';
  for (let r = 0; r < S.size; r++)
    for (let c = 0; c < S.size; c++)
      if (S.board[r][c]) {
        const isNew = newTile && newTile[0]===r && newTile[1]===c;
        cont.appendChild(makeTile(S.board[r][c], r, c, isNew));
      }

  if (S.score > S.best) { S.best = S.score; bump('best'); }
  bump('score');

  checkUnlocks();
  checkWin();
  checkLose();
  refresh();
  save();
}

function getLine(i, dir) {
  const ln = [];
  for (let j = 0; j < S.size; j++) {
    switch(dir) {
      case 'left':  ln.push(S.board[i][j]); break;
      case 'right': ln.push(S.board[i][S.size-1-j]); break;
      case 'up':    ln.push(S.board[j][i]); break;
      case 'down':  ln.push(S.board[S.size-1-j][i]); break;
    }
  }
  return ln;
}
function setLine(i, dir, ln) {
  for (let j = 0; j < S.size; j++) {
    switch(dir) {
      case 'left':  S.board[i][j] = ln[j]; break;
      case 'right': S.board[i][S.size-1-j] = ln[j]; break;
      case 'up':    S.board[j][i] = ln[j]; break;
      case 'down':  S.board[S.size-1-j][i] = ln[j]; break;
    }
  }
}
function mergeLine(line) {
  let f = line.filter(x=>x);
  let g=0, m=0;
  for (let i=0; i<f.length-1; i++) {
    if (f[i]===f[i+1]) { f[i]*=2; g+=f[i]; m++; f.splice(i+1,1); }
  }
  while (f.length<line.length) f.push(0);
  return [f,g,m];
}

/* ── WIN / LOSE ── */
function checkWin() {
  if (S.won || S.keepGoing) return;
  const tgt = LEVELS[S.lvl].target;
  for (let r=0;r<S.size;r++) for (let c=0;c<S.size;c++) if (S.board[r][c]>=tgt) {
    S.won = true;
    const acc = accuracy();
    saveBestAcc(acc);
    document.getElementById('win-sub').textContent =
      `Score ${S.score.toLocaleString()} · Accuracy ${acc}% · ${S.moves} moves`;
    document.getElementById('ov-win').classList.add('show');
    return;
  }
}
function checkLose() {
  if (S.over) return;
  for (let r=0;r<S.size;r++) for (let c=0;c<S.size;c++) if (!S.board[r][c]) return;
  for (let r=0;r<S.size;r++) for (let c=0;c<S.size;c++) {
    if (c<S.size-1 && S.board[r][c]===S.board[r][c+1]) return;
    if (r<S.size-1 && S.board[r][c]===S.board[r+1][c]) return;
  }
  S.over = true;
  document.getElementById('lose-sub').textContent =
    `Score ${S.score.toLocaleString()} · Accuracy ${accuracy()}% · ${S.moves} moves`;
  document.getElementById('ov-lose').classList.add('show');
}
function hideOverlays() {
  document.getElementById('ov-win').classList.remove('show');
  document.getElementById('ov-lose').classList.remove('show');
}

/* ── ACCURACY ── */
function accuracy() {
  return S.moves ? Math.round((S.prodMoves/S.moves)*100) : 0;
}
function saveBestAcc(a) {
  if (!S.bestAccByLvl[S.lvl] || a > S.bestAccByLvl[S.lvl]) { S.bestAccByLvl[S.lvl]=a; save(); }
}

/* ── UNLOCKS ── */
function checkUnlocks() {
  LEVELS.forEach(lv => {
    if (!S.unlocked.has(lv.id) && S.best >= lv.unlock) {
      S.unlocked.add(lv.id);
      buildLevelStrip();
      toast(`${lv.name} unlocked!`);
      save();
    }
  });
}

/* ── UNDO ── */
function pushHistory() {
  if (S.history.length >= 3) S.history.shift();
  S.history.push({
    board: S.board.map(r=>[...r]),
    score:S.score, moves:S.moves, merges:S.merges, prodMoves:S.prodMoves,
  });
}
function undoMove() {
  if (!S.history.length) { toast('Nothing to undo'); return; }
  const h = S.history.pop();
  Object.assign(S, { board:h.board, score:h.score, moves:h.moves, merges:h.merges, prodMoves:h.prodMoves });
  S.over = false;
  hideOverlays();
  render();
  refresh();
  toast('Undo!');
}

/* ── UI REFRESH ── */
function refresh() {
  /* scores */
  document.getElementById('score').textContent = S.score.toLocaleString();
  document.getElementById('best').textContent  = S.best.toLocaleString();
  /* stats */
  document.getElementById('st-moves').textContent  = S.moves;
  document.getElementById('st-merges').textContent = S.merges;
  document.getElementById('st-combo').textContent  = '×'+Math.max(1,S.streak);
  /* accuracy bar */
  const acc = accuracy();
  document.getElementById('acc-fill').style.width = acc+'%';
  document.getElementById('acc-pct').textContent  = S.moves ? acc+'%' : '—';
  /* level progress bar */
  const lv = LEVELS[S.lvl];
  let maxT = 0;
  for (let r=0;r<S.size;r++) for (let c=0;c<S.size;c++) if (S.board[r][c]>maxT) maxT=S.board[r][c];
  const pct = maxT ? Math.min(100,Math.round(Math.log2(maxT)/Math.log2(lv.target)*100)) : 0;
  document.getElementById('lvl-fill').style.width = pct+'%';
  document.getElementById('lvl-pct').textContent  = pct+'%';
  document.getElementById('bar-lvl-lbl').textContent = 'Target '+lv.target.toLocaleString();
}

function bump(id) {
  const el = document.getElementById(id);
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  setTimeout(()=>el.classList.remove('bump'),280);
}

/* ── TIMER ── */
function tickTimer() {
  if (S.over || S.won) return;
  const ms = Date.now()-S.t0+S.elapsed;
  const s = Math.floor(ms/1000)%60;
  const m = Math.floor(ms/60000);
  document.getElementById('st-timer').textContent = m+':'+String(s).padStart(2,'0');
}

/* ── TOAST ── */
let toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ── COMBO POP ── */
function showCombo(n) {
  const el = document.getElementById('combo-pop');
  el.textContent = n+'× COMBO!';
  el.classList.remove('fire');
  void el.offsetWidth;
  el.classList.add('fire');
}

/* ── SWIPE (full-screen) ── */
function bindSwipe() {
  let sx, sy, t;
  document.addEventListener('touchstart', e => {
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    t  = Date.now();
  }, { passive:true });

  document.addEventListener('touchend', e => {
    if (Date.now()-t > 500) return; // ignore long press
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx)<24 && Math.abs(dy)<24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx>0 ? 'right' : 'left');
    else                             move(dy>0 ? 'down'  : 'up');
  }, { passive:true });

  /* prevent page scroll when swiping on board */
  document.getElementById('boardBg').addEventListener('touchmove', e => {
    e.preventDefault();
  }, { passive:false });
}
</script>
