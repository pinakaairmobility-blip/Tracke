<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SplitTrack — Contribution Accounting</title>
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1558b0;
    --success: #34a853;
    --danger: #ea4335;
    --warn: #fbbc04;
    --bg: #f8f9fa;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #202124;
    --muted: #5f6368;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── HEADER ── */
  header { background: var(--primary); color: #fff; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.2); position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -.3px; }
  header span { font-size: .85rem; opacity: .85; }

  /* ── LAYOUT ── */
  .app { max-width: 1100px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } }

  /* ── SIDEBAR ── */
  .sidebar { display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .card h2 { font-size: .9rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 14px; }

  /* groups list */
  .group-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background .15s; font-size: .93rem; }
  .group-item:hover { background: #f1f3f4; }
  .group-item.active { background: #e8f0fe; color: var(--primary); font-weight: 600; }
  .group-item .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .8rem; flex-shrink: 0; }
  .group-item .del-btn { margin-left: auto; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; opacity: 0; transition: opacity .15s; }
  .group-item:hover .del-btn { opacity: 1; }

  /* ── MAIN ── */
  .main { display: flex; flex-direction: column; gap: 16px; }
  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; }
  .tab { flex: 1; padding: 9px; border: none; background: none; border-radius: 8px; cursor: pointer; font-size: .88rem; font-weight: 600; color: var(--muted); transition: all .15s; }
  .tab.active { background: var(--primary); color: #fff; }

  /* ── FORMS ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
  label { font-size: .82rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: .9rem; font-family: inherit; outline: none; transition: border-color .15s; background: #fff; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); }
  .form-row { display: flex; flex-direction: column; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: .9rem; font-weight: 600; cursor: pointer; transition: all .15s; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-outline { background: none; border: 1.5px solid var(--border); color: var(--text); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
  .btn-sm { padding: 6px 14px; font-size: .82rem; }

  /* ── MEMBERS CHIPS ── */
  .member-chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 20px; font-size: .82rem; font-weight: 600; }
  .chip.selected { color: #fff; }
  .chip input[type=checkbox] { display: none; }

  /* ── SPLIT SECTION ── */
  .split-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .split-row:last-child { border-bottom: none; }
  .split-row .name { flex: 1; font-size: .9rem; }
  .split-row input[type=number] { width: 90px; text-align: right; }
  .split-percent { color: var(--muted); font-size: .82rem; width: 46px; text-align: right; }

  /* ── EXPENSE LIST ── */
  .expense-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .expense-item:last-child { border-bottom: none; }
  .exp-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
  .exp-body { flex: 1; }
  .exp-title { font-weight: 600; font-size: .95rem; }
  .exp-meta { font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .exp-amount { font-weight: 700; font-size: 1rem; color: var(--primary); white-space: nowrap; }
  .exp-actions { display: flex; gap: 6px; align-items: center; }

  /* ── BALANCES ── */
  .balance-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .balance-item:last-child { border-bottom: none; }
  .bal-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; flex-shrink: 0; }
  .bal-info { flex: 1; }
  .bal-name { font-weight: 600; }
  .bal-detail { font-size: .8rem; color: var(--muted); }
  .bal-amount { font-weight: 700; font-size: 1rem; }
  .pos { color: var(--success); }
  .neg { color: var(--danger); }
  .zero { color: var(--muted); }

  /* ── SETTLE UP ── */
  .settle-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #fff8e1; border: 1px solid #ffe082; border-radius: 10px; margin-bottom: 10px; font-size: .9rem; }
  .settle-item .arrow { color: var(--warn); font-size: 1.1rem; }
  .settle-item .amt { font-weight: 700; color: #f57c00; margin-left: auto; }
  .settle-item .mark-btn { background: var(--success); color: #fff; border: none; border-radius: 6px; padding: 5px 12px; font-size: .8rem; cursor: pointer; margin-left: 10px; font-weight: 600; }

  /* ── SUMMARY CARDS ── */
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 500px) { .summary-grid { grid-template-columns: 1fr; } }
  .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .summary-card .val { font-size: 1.5rem; font-weight: 700; }
  .summary-card .lbl { font-size: .78rem; color: var(--muted); margin-top: 4px; }

  /* ── EMPTY STATE ── */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .icon { font-size: 2.5rem; margin-bottom: 10px; }

  /* ── MODAL ── */
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; align-items: center; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── TAG / BADGE ── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: .75rem; font-weight: 600; }
  .badge-green { background: #e6f4ea; color: #1e8e3e; }
  .badge-red { background: #fce8e6; color: #c5221f; }
  .badge-blue { background: #e8f0fe; color: #1a73e8; }

  /* ── TOAST ── */
  .toast { position: fixed; bottom: 24px; right: 24px; background: #323232; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: .88rem; font-weight: 500; z-index: 999; transform: translateY(80px); opacity: 0; transition: all .3s; }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ── MISC ── */
  .flex { display: flex; }
  .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; }
  .mt-12 { margin-top: 12px; }
  .mt-8 { margin-top: 8px; }
  .text-sm { font-size: .85rem; }
  .text-muted { color: var(--muted); }
  .bold { font-weight: 700; }
  .hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .w-full { width: 100%; }
  .category-emoji { font-size: 1.1rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>💰 SplitTrack</h1>
  <span>Contribution Accounting</span>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="card">
      <h2>Groups</h2>
      <div id="groupList" style="margin-bottom:12px"></div>
      <button class="btn btn-primary w-full" onclick="openNewGroupModal()">+ New Group</button>
    </div>
    <div class="card" id="memberCard" style="display:none">
      <h2>Members</h2>
      <div id="memberList" style="margin-bottom:12px"></div>
      <div class="flex gap-8 mt-8">
        <input id="newMemberName" placeholder="Member name" style="flex:1" onkeydown="if(event.key==='Enter')addMember()">

      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainArea">
    <div class="card empty" style="padding:60px 20px">
      <div class="icon">💼</div>
      <p class="bold">No group selected</p>
      <p class="text-sm text-muted mt-8">Create or select a group to start tracking contributions.</p>
    </div>
  </main>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- NEW GROUP MODAL -->
<div class="modal-backdrop" id="newGroupModal">
  <div class="modal">
    <h3>Create New Group</h3>
    <div class="form-row">

    </div>
    <div class="form-row mt-12">
      <label>Category</label>
      <select id="groupCategory">
        <option value="🏖️">🏖️ Trip / Vacation</option>
        <option value="🏠">🏠 Home / Flat</option>
        <option value="🍽️">🍽️ Food / Dining</option>
        <option value="🎉">🎉 Party / Event</option>
        <option value="💼">💼 Work / Office</option>
        <option value="🛒">🛒 Shopping</option>
        <option value="⚡">⚡ Utilities / Bills</option>
        <option value="🎮">🎮 Entertainment</option>
        <option value="🚗">🚗 Transport</option>
        <option value="📦">📦 Other</option>
      </select>
    </div>
    <div class="form-row mt-12">
      <label>Currency</label>
      <select id="groupCurrency">
        <option value="₹">₹ INR — Indian Rupee</option>
        <option value="$">$ USD — US Dollar</option>
        <option value="€">€ EUR — Euro</option>
        <option value="£">£ GBP — British Pound</option>
        <option value="¥">¥ JPY — Japanese Yen</option>
        <option value="AED">AED — UAE Dirham</option>
        <option value="SGD">SGD — Singapore Dollar</option>

    </div>
    <div class="form-row mt-12">
      <label>Initial Members (comma separated)</label>
      <input id="groupMembers" placeholder="Alice, Bob, Charlie">

    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('newGroupModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveGroup()">Create Group</button>
    </div>

</div>

<!-- ADD EXPENSE MODAL -->
<div class="modal-backdrop" id="expenseModal">
  <div class="modal">
    <h3>Add Expense</h3>
    <div class="form-grid">
      <div class="form-row" style="grid-column:1/-1">
        <label>Description</label>
        <input id="expDesc" placeholder="What was this for?">
      </div>
      <div class="form-row">
        <label>Amount (<span id="expCurrLabel">₹</span>)</label>

      </div>
      <div class="form-row">
        <label>Date</label>
        <input id="expDate" type="date">
      </div>
      <div class="form-row">
        <label>Category</label>
        <select id="expCategory">
          <option value="🍽️">🍽️ Food</option>
          <option value="🚗">🚗 Transport</option>
          <option value="🏨">🏨 Accommodation</option>
          <option value="🎟️">🎟️ Entertainment</option>
          <option value="🛒">🛒 Shopping</option>
          <option value="⚡">⚡ Utilities</option>
          <option value="💊">💊 Health</option>
          <option value="📦">📦 Other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Paid by</label>
        <select id="expPaidBy"></select>
      </div>
      <div class="form-row" style="grid-column:1/-1">
        <label>Split type</label>

          <button class="btn btn-outline btn-sm" data-type="exact" onclick="setSplitType('exact')">Exact amounts</button>
          <button class="btn btn-outline btn-sm" data-type="percent" onclick="setSplitType('percent')">Percentage</button>
          <button class="btn btn-outline btn-sm" data-type="shares" onclick="setSplitType('shares')">Shares</button>

      </div>
      <div class="form-row" style="grid-column:1/-1">
        <label>Split between</label>

      <div class="form-row" style="grid-column:1/-1">
        <label>Notes (optional)</label>
        <textarea id="expNotes" rows="2" placeholder="Any extra details…" style="resize:vertical"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('expenseModal')">Cancel</button>

<!-- EDIT EXPENSE MODAL (same structure, reused) -->
<div class="modal-backdrop" id="editExpenseModal">
  <div class="modal">
    <h3>Edit Expense</h3>
    <div class="form-grid">
      <div class="form-row" style="grid-column:1/-1">
        <label>Description</label>
        <input id="editExpDesc" placeholder="What was this for?">
      </div>
      <div class="form-row">
        <label>Amount (<span id="editExpCurrLabel">₹</span>)</label>
        <input id="editExpAmount" type="number" min="0.01" step="0.01" placeholder="0.00" oninput="recalcEditSplit()">
      </div>
      <div class="form-row">
        <label>Date</label>
        <input id="editExpDate" type="date">
      </div>
      <div class="form-row">
        <label>Category</label>
        <select id="editExpCategory">
          <option value="🍽️">🍽️ Food</option>
          <option value="🚗">🚗 Transport</option>
          <option value="🏨">🏨 Accommodation</option>
          <option value="🎟️">🎟️ Entertainment</option>
          <option value="🛒">🛒 Shopping</option>
          <option value="⚡">⚡ Utilities</option>
          <option value="💊">💊 Health</option>
          <option value="📦">📦 Other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Paid by</label>
        <select id="editExpPaidBy"></select>
      </div>
      <div class="form-row" style="grid-column:1/-1">
        <label>Split type</label>
        <div class="flex gap-8" id="editSplitTypeBtns">
          <button class="btn btn-primary btn-sm" data-type="equal" onclick="setEditSplitType('equal')">Equal</button>
          <button class="btn btn-outline btn-sm" data-type="exact" onclick="setEditSplitType('exact')">Exact amounts</button>
          <button class="btn btn-outline btn-sm" data-type="percent" onclick="setEditSplitType('percent')">Percentage</button>

        <div id="editSplitDetails"></div>
        <div id="editSplitError" style="color:var(--danger);font-size:.82rem;margin-top:6px"></div>
      </div>

      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('editExpenseModal')">Cancel</button>
      <button class="btn btn-primary" onclick="updateExpense()">Save Changes</button>
    </div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────────────────────
//  DATA LAYER
// ──────────────────────────────────────────────────────────────
const STORAGE_KEY = 'splittrack_v2';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { groups: [], settlements: [] }; }
  catch { return { groups: [], settlements: [] }; }
}
function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

let db = loadData();
let activeGroupId = db.groups.length ? db.groups[0].id : null;
let splitType = 'equal';
let editSplitType = 'equal';
let editingExpenseId = null;
let activeTab = 'expenses';

// ──────────────────────────────────────────────────────────────
//  UTILITIES
// ──────────────────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function fmtAmt(n, curr) { return curr + ' ' + Math.abs(n).toLocaleString('en-IN', {minimumFractionDigits:2,maximumFractionDigits:2}); }

const COLORS = ['#1a73e8','#34a853','#ea4335','#fbbc04','#9334e8','#00acc1','#f6892b','#5c6bc0','#e91e8c','#00897b'];
function memberColor(name) {
  let h = 0; for (let c of name) h = (h*31 + c.charCodeAt(0)) & 0xffff;
  return COLORS[h % COLORS.length];
}
function initials(name) { return name.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2); }

function toast(msg, dur=2800) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function today() { return new Date().toISOString().slice(0,10); }

function getGroup(id) { return db.groups.find(g => g.id === id); }

// ──────────────────────────────────────────────────────────────
//  DEBT SIMPLIFICATION  (Splitwise algorithm)
// ──────────────────────────────────────────────────────────────
function computeBalances(group) {
  const bal = {};
  group.members.forEach(m => bal[m] = 0);

  group.expenses.forEach(exp => {
    // payer gets credit
    bal[exp.paidBy] = (bal[exp.paidBy] || 0) + exp.amount;
    // each participant owes their share
    Object.entries(exp.splits).forEach(([m, share]) => {
      bal[m] = (bal[m] || 0) - share;
    });
  });

  // subtract settled amounts
  (db.settlements || [])
    .filter(s => s.groupId === group.id)
    .forEach(s => {
      bal[s.from] = (bal[s.from] || 0) + s.amount;
      bal[s.to]   = (bal[s.to]   || 0) - s.amount;
    });

  return bal;
}

function simplifyDebts(balances) {
  const pos = [], neg = [];
  Object.entries(balances).forEach(([person, amt]) => {
    const r = Math.round(amt * 100) / 100;
    if (r > 0.005)  pos.push({ person, amt: r });
    if (r < -0.005) neg.push({ person, amt: -r });
  });
  pos.sort((a,b) => b.amt - a.amt);
  neg.sort((a,b) => b.amt - a.amt);

  const txns = [];
  let i = 0, j = 0;
  while (i < pos.length && j < neg.length) {
    const settled = Math.min(pos[i].amt, neg[j].amt);
    settled > 0.005 && txns.push({ from: neg[j].person, to: pos[i].person, amount: Math.round(settled*100)/100 });
    pos[i].amt -= settled;
    neg[j].amt -= settled;
    if (pos[i].amt < 0.005) i++;
    if (neg[j].amt < 0.005) j++;
  }
  return txns;
}

// ──────────────────────────────────────────────────────────────
//  SPLIT CALCULATION
// ──────────────────────────────────────────────────────────────
function calcEqualSplit(amount, members) {
  if (!members.length) return {};
  const each = Math.floor((amount / members.length) * 100) / 100;
  const remainder = Math.round((amount - each * members.length) * 100);
  const splits = {};
  members.forEach((m, i) => splits[m] = each + (i < remainder ? 0.01 : 0));
  return splits;
}

function calcSplitFromInputs(amount, members, type, prefix='') {
  const splits = {};
  let valid = true, err = '';

  if (type === 'equal') {
    return { splits: calcEqualSplit(amount, members), valid: true, err: '' };
  }
  if (type === 'exact') {
    let total = 0;
    members.forEach(m => {
      const v = parseFloat(document.getElementById(`${prefix}split_${CSS.escape(m)}`)?.value || 0);
      splits[m] = v; total += v;
    });
    if (Math.abs(total - amount) > 0.01) { valid = false; err = `Exact amounts sum to ${total.toFixed(2)} but expense is ${amount.toFixed(2)}`; }
  }
  if (type === 'percent') {
    let total = 0;
    members.forEach(m => {
      const v = parseFloat(document.getElementById(`${prefix}split_${CSS.escape(m)}`)?.value || 0);
      splits[m] = Math.round(amount * v) / 100;
      total += v;
    });
    if (Math.abs(total - 100) > 0.01) { valid = false; err = `Percentages sum to ${total.toFixed(1)}% (must be 100%)`; }
  }
  if (type === 'shares') {
    let total = 0;
    const shares = {};
    members.forEach(m => {
      const v = parseFloat(document.getElementById(`${prefix}split_${CSS.escape(m)}`)?.value || 1);
      shares[m] = v; total += v;
    });
    members.forEach(m => splits[m] = Math.round(amount * shares[m] / total * 100) / 100);
    // fix rounding
    const diff = Math.round((amount - Object.values(splits).reduce((a,b)=>a+b,0)) * 100);
    if (diff && members.length) splits[members[0]] = Math.round((splits[members[0]] + diff/100)*100)/100;
  }
  return { splits, valid, err };
}

    <div class="group-item ${g.id===activeGroupId?'active':''}" onclick="selectGroup('${g.id}')">
      <div class="avatar" style="background:${memberColor(g.name)};color:#fff">${g.icon}</div>
      <div>
        <div>${g.name}</div>
        <div style="font-size:.75rem;color:var(--muted)">${g.members.length} members</div>
      </div>

function renderMain() {
  const area = document.getElementById('mainArea');
  if (!activeGroupId) {
    area.innerHTML = `<div class="card empty" style="padding:60px 20px"><div class="icon">💼</div><p class="bold">No group selected</p><p class="text-sm text-muted mt-8">Create or select a group to start tracking contributions.</p></div>`;
    return;
  }
  const g = getGroup(activeGroupId);

  // Summary
  const totalExp = g.expenses.reduce((s,e)=>s+e.amount,0);
  const balances = computeBalances(g);
  const totalOwed = Object.values(balances).filter(v=>v<0).reduce((s,v)=>s+Math.abs(v),0);
  const debts = simplifyDebts(balances);

  area.innerHTML = `
    <div class="summary-grid">
      <div class="summary-card">
        <div class="val">${g.icon}</div>
        <div class="lbl">${g.name}</div>
      </div>
      <div class="summary-card">

        <div class="lbl">Total Expenses</div>
      </div>
      <div class="summary-card">
        <div class="val" style="color:var(--warn)">${debts.length}</div>
        <div class="lbl">Pending Settlements</div>

      <button class="tab ${activeTab==='activity'?'active':''}" onclick="switchTab('activity')">📊 Activity</button>

}

function renderTab() {
  const g = getGroup(activeGroupId);
  const content = document.getElementById('tabContent');
  if (!content) return;

  if (activeTab === 'expenses') renderExpensesTab(g, content);
  else if (activeTab === 'balances') renderBalancesTab(g, content);
  else if (activeTab === 'settle') renderSettleTab(g, content);
  else if (activeTab === 'activity') renderActivityTab(g, content);
}

function renderExpensesTab(g, el) {

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">

  } else {
    // sort newest first
    const sorted = [...g.expenses].sort((a,b) => new Date(b.date)-new Date(a.date));
    html += sorted.map(exp => {
      const splitSummary = Object.entries(exp.splits).map(([m,v])=>`${m}: ${g.currency}${v.toFixed(2)}`).join(', ');
      return `
        <div class="expense-item">
          <div class="exp-icon" style="background:#f1f3f4">${exp.category}</div>
          <div class="exp-body">

          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            <div class="exp-amount">${g.currency}${exp.amount.toFixed(2)}</div>
            <div class="exp-actions">

              <button class="btn btn-danger btn-sm" onclick="deleteExpense('${exp.id}')">Delete</button>
            </div>
          </div>

  el.innerHTML = html;
}

function renderBalancesTab(g, el) {
  const balances = computeBalances(g);
  const sorted = Object.entries(balances).sort((a,b)=>b[1]-a[1]);

  let html = `<div class="card"><h2>Member Balances</h2>`;
  if (!sorted.length) {
    html += `<div class="empty"><div class="icon">⚖️</div><p>Add members and expenses to see balances.</p></div>`;
  } else {
    html += sorted.map(([name, bal]) => {
      const cls = bal > 0.005 ? 'pos' : bal < -0.005 ? 'neg' : 'zero';
      const label = bal > 0.005 ? `gets back ${g.currency}${bal.toFixed(2)}` :
                    bal < -0.005 ? `owes ${g.currency}${Math.abs(bal).toFixed(2)}` : 'settled up';
      return `
        <div class="balance-item">
          <div class="bal-avatar" style="background:${memberColor(name)};color:#fff">${initials(name)}</div>
          <div class="bal-info">
            <div class="bal-name">${name}</div>
            <div class="bal-detail">${label}</div>
          </div>
          <div class="bal-amount ${cls}">${bal >= 0 ? '+' : ''}${g.currency}${bal.toFixed(2)}</div>
        </div>`;
    }).join('');
  }
  html += `</div>`;
  el.innerHTML = html;
}

function renderSettleTab(g, el) {
  const balances = computeBalances(g);
  const debts = simplifyDebts(balances);

  let html = `<div class="card"><h2>Settle Up</h2>`;
  if (!debts.length) {
    html += `<div class="empty"><div class="icon">🎉</div><p class="bold">All settled!</p><p class="text-sm text-muted mt-8">No outstanding payments.</p></div>`;
  } else {
    html += `<p class="text-sm text-muted" style="margin-bottom:14px">${debts.length} payment${debts.length>1?'s':''} needed to settle all debts:</p>`;
    html += debts.map(d => `
      <div class="settle-item">
        <div class="bal-avatar" style="background:${memberColor(d.from)};color:#fff;width:34px;height:34px;font-size:.8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">${initials(d.from)}</div>
        <div style="flex:1">
          <strong>${d.from}</strong> <span class="arrow">→</span> <strong>${d.to}</strong>
        </div>
        <div class="amt">${g.currency}${d.amount.toFixed(2)}</div>
        <button class="mark-btn" onclick="markSettled('${d.from}','${d.to}',${d.amount})">Mark Paid</button>
      </div>`).join('');
  }

  // settlement history
  const history = (db.settlements||[]).filter(s=>s.groupId===g.id);
  if (history.length) {
    html += `<hr class="hr"><h2 style="margin-bottom:12px">Settlement History</h2>`;
    html += history.slice().reverse().map(s => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.88rem">
        <span style="flex:1"><strong>${s.from}</strong> paid <strong>${s.to}</strong></span>

        <span style="color:var(--muted)">${s.date}</span>
        <button onclick="removeSettlement('${s.id}')" style="background:none;border:none;color:var(--muted);cursor:pointer" title="Undo">✕</button>
      </div>`).join('');
  }
  html += `</div>`;
  el.innerHTML = html;
}

function renderActivityTab(g, el) {
  // per-member spend breakdown
  const paid = {}, owed = {};
  g.members.forEach(m => { paid[m] = 0; owed[m] = 0; });
  g.expenses.forEach(exp => {
    paid[exp.paidBy] = (paid[exp.paidBy]||0) + exp.amount;
    Object.entries(exp.splits).forEach(([m,v]) => owed[m] = (owed[m]||0)+v);
  });

  // category breakdown
  const catTotals = {};
  g.expenses.forEach(e => catTotals[e.category] = (catTotals[e.category]||0)+e.amount);
  const catSorted = Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const total = g.expenses.reduce((s,e)=>s+e.amount,0);

  let html = `<div class="card"><h2>Spending Breakdown</h2>`;

  if (!g.expenses.length) {
    html += `<div class="empty"><div class="icon">📊</div><p>No data yet.</p></div>`;
  } else {
    html += `<h3 style="font-size:.85rem;color:var(--muted);margin-bottom:10px;font-weight:700">BY MEMBER</h3>`;
    html += g.members.map(m => {
      const pct = total > 0 ? (paid[m]/total*100).toFixed(1) : 0;
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
          <div class="bal-avatar" style="background:${memberColor(m)};color:#fff">${initials(m)}</div>
          <div style="flex:1">
            <div style="font-weight:600">${m}</div>
            <div style="font-size:.78rem;color:var(--muted)">Paid ${g.currency}${(paid[m]||0).toFixed(2)} · Owes ${g.currency}${(owed[m]||0).toFixed(2)}</div>
            <div style="background:#e0e0e0;border-radius:4px;height:6px;margin-top:6px;overflow:hidden">
              <div style="background:${memberColor(m)};height:100%;width:${pct}%;transition:width .4s"></div>
            </div>
          </div>
          <div style="font-size:.85rem;color:var(--muted)">${pct}%</div>
        </div>`;
    }).join('');

    html += `<h3 style="font-size:.85rem;color:var(--muted);margin:18px 0 10px;font-weight:700">BY CATEGORY</h3>`;
    html += catSorted.map(([cat, amt]) => {
      const pct = total > 0 ? (amt/total*100).toFixed(1) : 0;
      return `
        <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
          <span style="font-size:1.2rem">${cat}</span>
          <div style="flex:1">
            <div style="background:#e0e0e0;border-radius:4px;height:8px;overflow:hidden">
              <div style="background:var(--primary);height:100%;width:${pct}%"></div>
            </div>
          </div>
          <span style="font-weight:600;min-width:80px;text-align:right">${g.currency}${amt.toFixed(2)}</span>
          <span style="color:var(--muted);font-size:.8rem;min-width:38px;text-align:right">${pct}%</span>
        </div>`;
    }).join('');
  }
  html += `</div>`;
  el.innerHTML = html;
}

function openNewGroupModal() {
  document.getElementById('groupName').value = '';
  document.getElementById('groupMembers').value = '';
  document.getElementById('newGroupModal').classList.add('open');
  setTimeout(() => document.getElementById('groupName').focus(), 100);
}

function saveGroup() {
  const name = document.getElementById('groupName').value.trim();
  if (!name) { toast('Please enter a group name'); return; }
  const members = document.getElementById('groupMembers').value.split(',')
    .map(m=>m.trim()).filter(Boolean);
  const id = uid();
  db.groups.push({
    id, name,
    icon: document.getElementById('groupCategory').value,
    currency: document.getElementById('groupCurrency').value,
    members,
    expenses: []
  });
  saveData(db);
  activeGroupId = id;
  activeTab = 'expenses';
  closeModal('newGroupModal');
  render();
  toast(`Group "${name}" created`);
}

function selectGroup(id) {
  activeGroupId = id;
  activeTab = 'expenses';
  render();
}

function deleteGroup(id) {
  if (!confirm('Delete this group and all its expenses?')) return;
  db.groups = db.groups.filter(g=>g.id!==id);
  db.settlements = (db.settlements||[]).filter(s=>s.groupId!==id);
  if (activeGroupId === id) activeGroupId = db.groups[0]?.id || null;
  saveData(db);
  render();
  toast('Group deleted');
}

function addMember() {
  const inp = document.getElementById('newMemberName');
  const name = inp.value.trim();
  if (!name) return;
  const g = getGroup(activeGroupId);
  if (g.members.includes(name)) { toast('Member already exists'); return; }
  g.members.push(name);
  inp.value = '';
  saveData(db);
  render();
  toast(`${name} added`);
}

function removeMember(name) {
  const g = getGroup(activeGroupId);
  const inUse = g.expenses.some(e => e.paidBy===name || Object.keys(e.splits).includes(name));
  if (inUse && !confirm(`${name} has expenses recorded. Remove anyway?`)) return;
  g.members = g.members.filter(m=>m!==name);
  saveData(db);
  render();
  toast(`${name} removed`);
}

  document.getElementById('expCategory').value = '🍽️';

function setSplitType(type) {
  splitType = type;
  document.querySelectorAll('#splitTypeBtns .btn').forEach(b=>{
    b.className = b.dataset.type===type ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';

function getCheckedMembers(prefix='') {
  const g = getGroup(activeGroupId);
  if (prefix==='') {
    // default: all members checked
    const boxes = document.querySelectorAll('#splitMembersCheck input[type=checkbox]');
    if (!boxes.length) return [...g.members];
    return [...boxes].filter(c=>c.checked).map(c=>c.value);
  }
  const boxes = document.querySelectorAll('#editSplitMembersCheck input[type=checkbox]');
  if (!boxes.length) return [];
  return [...boxes].filter(c=>c.checked).map(c=>c.value);
}

function renderSplitDetails() {
  const g = getGroup(activeGroupId);
  const amount = parseFloat(document.getElementById('expAmount').value) || 0;

  // render member checkboxes
  const chk = document.getElementById('splitMembersCheck');
  if (!chk.children.length) {
    chk.innerHTML = g.members.map(m=>`
      <label class="chip" style="background:${memberColor(m)};color:#fff;cursor:pointer">
        <input type="checkbox" value="${m}" checked onchange="renderSplitDetails()">
        ${initials(m)} ${m.split(' ')[0]}
      </label>`).join('');
  }

  const members = getCheckedMembers('');
  const det = document.getElementById('splitDetails');
  if (!members.length) { det.innerHTML = ''; return; }
  if (splitType === 'equal') {
    const each = amount/members.length;
    det.innerHTML = `<p class="text-sm text-muted">Each person pays <strong>${g.currency}${each.toFixed(2)}</strong></p>`;
  } else if (splitType === 'exact') {
    det.innerHTML = members.map(m=>`
      <div class="split-row">
        <div class="name">${m}</div>
        <input type="number" id="split_${CSS.escape(m)}" min="0" step="0.01" placeholder="0.00" oninput="recalcSplit()">
      </div>`).join('');
  } else if (splitType === 'percent') {
    const pct = members.length ? (100/members.length).toFixed(1) : 0;
    det.innerHTML = members.map(m=>`
      <div class="split-row">
        <div class="name">${m}</div>
        <input type="number" id="split_${CSS.escape(m)}" min="0" max="100" step="0.1" value="${pct}" oninput="recalcSplit()">
        <span class="split-percent">%</span>
      </div>`).join('');
    recalcSplit();
  } else if (splitType === 'shares') {
    det.innerHTML = members.map(m=>`
      <div class="split-row">
        <div class="name">${m}</div>
        <input type="number" id="split_${CSS.escape(m)}" min="1" step="1" value="1" oninput="recalcSplit()">
        <span class="split-percent">share</span>
      </div>`).join('');
    recalcSplit();
  }
}

function recalcSplit() {
  const g = getGroup(activeGroupId);
  const amount = parseFloat(document.getElementById('expAmount').value) || 0;
  const members = getCheckedMembers('');
  const { err } = calcSplitFromInputs(amount, members, splitType, '');
  document.getElementById('splitError').textContent = err;
}

function saveExpense() {
  const g = getGroup(activeGroupId);
  const desc = document.getElementById('expDesc').value.trim();
  const amount = parseFloat(document.getElementById('expAmount').value);
  const date = document.getElementById('expDate').value;
  const category = document.getElementById('expCategory').value;
  const paidBy = document.getElementById('expPaidBy').value;
  const notes = document.getElementById('expNotes').value.trim();
  const members = getCheckedMembers('');

  if (!desc) { toast('Enter a description'); return; }
  if (!amount || amount <= 0) { toast('Enter a valid amount'); return; }
  if (!members.length) { toast('Select at least one member'); return; }

  const { splits, valid, err } = calcSplitFromInputs(amount, members, splitType, '');
  if (!valid) { document.getElementById('splitError').textContent = err; return; }

  g.expenses.push({ id: uid(), desc, amount, date, category, paidBy, splits, notes });
  saveData(db);
  closeModal('expenseModal');
  render();
  toast(`Expense "${desc}" added`);
}

  document.getElementById('editExpDate').value = exp.date;
  document.getElementById('editExpCategory').value = exp.category;
  document.getElementById('editExpNotes').value = exp.notes||'';

    `<option ${m===exp.paidBy?'selected':''}>${m}</option>`).join('');

      </div>`).join('');

    const pct = members.length ? (100/members.length).toFixed(1) : 0;
    det.innerHTML = members.map(m=>`
      <div class="split-row">
        <div class="name">${m}</div>
        <input type="number" id="split_${CSS.escape(m)}" min="0" max="100" step="0.1" value="${pct}" oninput="recalcEditSplit()">
        <span class="split-percent">%</span>
      </div>`).join('');
    recalcEditSplit();

      <div class="split-row">
        <div class="name">${m}</div>
        <input type="number" id="split_${CSS.escape(m)}" min="1" step="1" value="1" oninput="recalcEditSplit()">
        <span class="split-percent">share</span>
      </div>`).join('');

function recalcEditSplit() {
  const g = getGroup(activeGroupId);
  const amount = parseFloat(document.getElementById('editExpAmount').value) || 0;
  const members = getCheckedMembers('edit');
  const { err } = calcSplitFromInputs(amount, members, editSplitType, '');
  document.getElementById('editSplitError').textContent = err;
}

function updateExpense() {
  const g = getGroup(activeGroupId);
  const expIdx = g.expenses.findIndex(e=>e.id===editingExpenseId);
  if (expIdx === -1) return;

  const desc = document.getElementById('editExpDesc').value.trim();
  const amount = parseFloat(document.getElementById('editExpAmount').value);
  const date = document.getElementById('editExpDate').value;
  const category = document.getElementById('editExpCategory').value;
  const paidBy = document.getElementById('editExpPaidBy').value;
  const notes = document.getElementById('editExpNotes').value.trim();
  const members = getCheckedMembers('edit');

  if (!desc) { toast('Enter a description'); return; }
  if (!amount || amount <= 0) { toast('Enter a valid amount'); return; }
  if (!members.length) { toast('Select at least one member'); return; }

  const { splits, valid, err } = calcSplitFromInputs(amount, members, editSplitType, '');
  if (!valid) { document.getElementById('editSplitError').textContent = err; return; }

  g.expenses[expIdx] = { ...g.expenses[expIdx], desc, amount, date, category, paidBy, splits, notes };
  saveData(db);
  closeModal('editExpenseModal');
  render();
  toast('Expense updated');
}

function deleteExpense(expId) {
  if (!confirm('Delete this expense?')) return;
  const g = getGroup(activeGroupId);
  g.expenses = g.expenses.filter(e=>e.id!==expId);
  saveData(db);
  render();
  toast('Expense deleted');
}

// ──────────────────────────────────────────────────────────────
//  SETTLEMENTS
// ──────────────────────────────────────────────────────────────
function markSettled(from, to, amount) {
  db.settlements = db.settlements || [];
  db.settlements.push({ id: uid(), groupId: activeGroupId, from, to, amount, date: today() });
  saveData(db);
  render();
  toast(`${from} → ${to} settlement recorded`);
}

function removeSettlement(sid) {
  db.settlements = (db.settlements||[]).filter(s=>s.id!==sid);
  saveData(db);
  render();
  toast('Settlement removed');
}

// ──────────────────────────────────────────────────────────────
//  UI HELPERS
// ──────────────────────────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  render();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// close on backdrop click
document.querySelectorAll('.modal-backdrop').forEach(bd => {
  bd.addEventListener('click', e => { if (e.target===bd) bd.classList.remove('open'); });
});

// ──────────────────────────────────────────────────────────────
//  INIT
// ──────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
